<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>REquinki</title>
<link rel="icon" href="img/logo-avatar.svg">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #04060d;
    --bg2: #070b1a;
    --card: rgba(14, 22, 52, .55);
    --line: rgba(80, 130, 255, .22);
    --neon: #3d7bff;
    --neon2: #7fa8ff;
    --text: #dfe6ff;
    --muted: #7d89ad;
    --glow: 0 0 12px rgba(61, 123, 255, .65), 0 0 32px rgba(61, 123, 255, .35);
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 Inter, system-ui, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* --- фон: сетка, точки, плёнка --- */
  .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .bg::before {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(circle at 50% 18%, rgba(40, 80, 220, .28), transparent 55%),
      linear-gradient(rgba(80,130,255,.05) 1px, transparent 1px) 0 0 / 28px 28px,
      linear-gradient(90deg, rgba(80,130,255,.05) 1px, transparent 1px) 0 0 / 28px 28px;
  }
  .film {
    position: absolute; width: 160%; height: 46px; left: -30%;
    background:
      repeating-linear-gradient(90deg, transparent 0 6px, rgba(4,6,13,.9) 6px 14px) top / 100% 7px no-repeat,
      repeating-linear-gradient(90deg, transparent 0 6px, rgba(4,6,13,.9) 6px 14px) bottom / 100% 7px no-repeat,
      repeating-linear-gradient(90deg, rgba(20,34,80,.55) 0 58px, rgba(4,6,13,.8) 58px 62px);
    border-top: 1px solid rgba(110,150,255,.35); border-bottom: 1px solid rgba(110,150,255,.35);
    opacity: .45;
  }
  .film.f1 { top: 120px; transform: rotate(-32deg); }
  .film.f2 { top: 70%; transform: rotate(-32deg); opacity: .3; }

  .wrap { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: 18px 16px 110px; }

  /* --- HUD-подписи --- */
  .hud { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: .04em; }
  .hud b { color: var(--neon2); font-weight: 600; }
  .hud-top { display: flex; justify-content: space-between; margin-bottom: 10px; }

  /* --- шапка --- */
  .hero { text-align: center; padding: 14px 0 6px; }
  .ring {
    width: 148px; height: 148px; margin: 6px auto 16px; border-radius: 50%;
    border: 2px solid var(--neon); box-shadow: var(--glow), inset 0 0 18px rgba(61,123,255,.5);
    padding: 6px; position: relative;
  }
  .ring::after {
    content: ""; position: absolute; inset: -12px; border-radius: 50%;
    border: 1px dashed rgba(127,168,255,.35); animation: spin 40s linear infinite;
  }
  .ring img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 {
    font-family: var(--mono); font-weight: 600; font-size: 26px; margin: 0;
    letter-spacing: .32em; padding-left: .32em; text-shadow: 0 0 18px rgba(61,123,255,.55);
    display: inline-flex; align-items: center; gap: 14px;
  }
  h1 img { height: 40px; letter-spacing: 0; }
  .tagline { color: var(--muted); margin: 4px 0 0; }
  .glitch { animation: glitch 6s infinite steps(1); }
  @keyframes glitch {
    0%, 96%, 100% { transform: none; text-shadow: 0 0 18px rgba(61,123,255,.55); }
    97% { transform: translateX(-2px); text-shadow: 2px 0 #ff2a6d, -2px 0 #3d7bff; }
    98% { transform: translateX(2px); text-shadow: -2px 0 #ff2a6d, 2px 0 #3d7bff; }
  }

  /* --- секции --- */
  section { display: none; animation: fade .25s ease; }
  section.on { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } }
  h2 {
    font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--neon2);
    text-transform: uppercase; letter-spacing: .12em; margin: 26px 0 12px;
    display: flex; align-items: center; gap: 10px;
  }
  h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; margin-bottom: 12px; backdrop-filter: blur(6px);
  }
  .card h3 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
  .card p { margin: 0; color: var(--muted); font-size: 14px; }
  .price { font-family: var(--mono); color: var(--neon2); font-weight: 600; white-space: nowrap; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .row + .row { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .chip {
    display: inline-block; font-family: var(--mono); font-size: 10px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--neon2); border: 1px solid var(--line);
    border-radius: 99px; padding: 2px 8px; margin-bottom: 8px;
  }
  .note { font-size: 13px; color: var(--muted); }

  /* --- портфолио --- */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .work {
    border-radius: 12px; overflow: hidden; border: 1px solid var(--line);
    background: var(--bg2); cursor: pointer; position: relative;
  }
  .work .thumb { aspect-ratio: 1; display: grid; place-items: center; overflow: hidden; }
  .work .thumb img, .work .thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .work .ph {
    width: 100%; height: 100%; display: grid; place-items: center; text-align: center;
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    background: radial-gradient(circle, rgba(61,123,255,.18), transparent 70%);
  }
  .work .cap { padding: 8px 10px; font-size: 13px; }
  .work .cap small { display: block; color: var(--muted); font-family: var(--mono); font-size: 10px; }
  .modal {
    position: fixed; inset: 0; background: rgba(2,3,8,.92); z-index: 20; display: none;
    padding: 20px 16px; overflow: auto;
  }
  .modal.on { display: block; }
  .modal .box { max-width: 520px; margin: 0 auto; }
  .modal img, .modal video { width: 100%; border-radius: 12px; border: 1px solid var(--line); display: block; }
  .modal h3 { margin: 14px 0 4px; }
  .modal p { color: var(--muted); margin: 0 0 16px; }

  /* --- форма --- */
  label { display: block; font-family: var(--mono); font-size: 11px; color: var(--muted);
          text-transform: uppercase; letter-spacing: .08em; margin: 14px 0 6px; }
  input, select, textarea {
    width: 100%; background: rgba(7,11,26,.85); color: var(--text); font: inherit;
    border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--neon); box-shadow: 0 0 0 3px rgba(61,123,255,.2); }
  textarea { min-height: 110px; resize: vertical; }
  .btn {
    display: block; width: 100%; margin-top: 18px; padding: 14px; border: 0; border-radius: 12px;
    background: var(--neon); color: #fff; font: 600 15px Inter, sans-serif; cursor: pointer;
    box-shadow: var(--glow);
  }
  .btn:active { transform: scale(.98); }
  .btn.ghost { background: transparent; border: 1px solid var(--neon); box-shadow: none; color: var(--neon2); }
  .err { color: #ff6b8b; font-size: 13px; margin-top: 8px; min-height: 1em; }
  .done { text-align: center; padding: 30px 10px; }
  .done .big { font-family: var(--mono); color: var(--neon2); font-size: 13px; letter-spacing: .1em; }

  /* --- контакты --- */
  .links a {
    display: flex; justify-content: space-between; align-items: center; text-decoration: none;
    color: var(--text); padding: 13px 14px; border: 1px solid var(--line); border-radius: 12px;
    margin-bottom: 8px; background: var(--card);
  }
  .links a span { font-family: var(--mono); font-size: 12px; color: var(--neon2); }

  /* --- нижнее меню --- */
  nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: flex; justify-content: center; gap: 4px;
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
    background: rgba(4,6,13,.88); border-top: 1px solid var(--line); backdrop-filter: blur(10px);
  }
  nav button {
    flex: 1; max-width: 130px; background: none; border: 0; color: var(--muted); cursor: pointer;
    font: 500 11px Inter, sans-serif; padding: 6px 0; border-radius: 10px;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  nav button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; }
  nav button.on { color: var(--neon2); background: rgba(61,123,255,.12); }
  nav button.on svg { filter: drop-shadow(0 0 6px rgba(61,123,255,.8)); }

  .foot { text-align: center; margin-top: 30px; }
</style>
</head>
<body>
<div class="bg"><div class="film f1"></div><div class="film f2"></div></div>

<div class="wrap">
  <div class="hud hud-top"><span>//requinki.exe</span><span>status: <b>online</b></span></div>

  <div class="hero">
    <div class="ring"><img src="img/avatar.jpg" alt="REquinki"></div>
    <h1 class="glitch"><img src="img/logo-mark.svg" alt="">REQUINKI</h1>
    <p class="tagline">моушн-дизайн · Roblox-графика · Telegram-боты</p>
  </div>

  <!-- ===== УСЛУГИ ===== -->
  <section id="s-services" class="on">
    <div id="services"></div>
    <p class="note">Цены стартовые. Точную сумму назову, когда увижу задачу.</p>
    <button class="btn" onclick="go('order')">Оставить заявку</button>
  </section>

  <!-- ===== ПОРТФОЛИО ===== -->
  <section id="s-works">
    <h2>работы</h2>
    <div class="grid" id="works"></div>
  </section>

  <!-- ===== ЗАЯВКА ===== -->
  <section id="s-order">
    <h2>заявка</h2>
    <div class="card" id="order-form">
      <label for="f-service">Что нужно</label>
      <select id="f-service"></select>

      <label for="f-task">Опишите задачу</label>
      <textarea id="f-task" placeholder="Например: превью для симулятора, стиль как у ..., нужно к пятнице"></textarea>

      <label for="f-budget">Бюджет (необязательно)</label>
      <input id="f-budget" placeholder="1500 ₽ или 3000 R$">

      <label for="f-deadline">Когда нужно (необязательно)</label>
      <input id="f-deadline" placeholder="к 15 октября">

      <div class="err" id="f-err"></div>
      <button class="btn" onclick="sendOrder()">Отправить</button>
    </div>
    <div class="card done" id="order-done" style="display:none">
      <div class="big">// заявка отправлена</div>
      <p style="margin-top:10px">Отвечу прямо в этом чате.</p>
    </div>
  </section>

  <!-- ===== ОБО МНЕ ===== -->
  <section id="s-about">
    <h2>обо мне</h2>
    <div class="card" id="about"></div>
    <h2>контакты</h2>
    <div class="links" id="links"></div>
  </section>

  <div class="hud foot">keep your masks on.<br>//identity.exe</div>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeWork()">
  <div class="box">
    <div id="m-media"></div>
    <h3 id="m-title"></h3>
    <p id="m-desc"></p>
    <button class="btn ghost" onclick="closeWork()">Закрыть</button>
  </div>
</div>

<nav>
  <button data-tab="services" class="on" onclick="go('services')">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9h10M7 13h6"/></svg>Услуги</button>
  <button data-tab="works" onclick="go('works')">
    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18M3 15h18M7 5v4M12 5v4M17 5v4M7 15v4M12 15v4M17 15v4"/></svg>Работы</button>
  <button data-tab="order" onclick="go('order')">
    <svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/></svg>Заявка</button>
  <button data-tab="about" onclick="go('about')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Обо мне</button>
</nav>

<script>
/* =====================================================
   ВСЁ, ЧТО МОЖНО МЕНЯТЬ БЕЗ КОДА, — В ЭТОМ БЛОКЕ
   ===================================================== */

const SERVICES = [
  {
    group: "Telegram-боты",
    chip: "python",
    desc: "Меню, анкеты, приём заявок. Заявки приходят вам в чат, отвечаете прямо оттуда.",
    items: [
      ["Бот-визитка: меню до 5 кнопок", "500 ₽"],
      ["Анкета или заявка + ответ клиенту через бота", "1 500 ₽"],
      ["Всё выше + автопроверка, рассылка, автоперезапуск", "3 000 ₽"],
      ["Мини-приложение внутри бота, как это", "от 3 000 ₽"],
    ],
  },
  {
    group: "Roblox-графика",
    chip: "R$ / ₽",
    desc: "Для ваших игр и групп. Оплата робуксами через выплату из группы или рублями.",
    items: [
      ["Позинг: персонаж в позе из Blender + обработка", "100–200 R$"],
      ["Иконка игры", "от 200 R$"],
      ["Превью (thumbnail)", "от 300 R$"],
      ["Трейлер или короткий эдит", "до 500 R$"],
    ],
  },
  {
    group: "Моушн и эдиты",
    chip: "after effects",
    desc: "Анимация интерфейса, эдиты под TikTok и Shorts, аватарки и обложки.",
    items: [
      ["Аватарка или обложка", "договорная"],
      ["Эдит / анимация", "договорная"],
    ],
  },
];

// img — путь к картинке в папке img/, video — к видео (mp4). Если нет ни того ни другого, будет заглушка.
const WORKS = [
  { title: "Аватарка для TikTok", tag: "позинг", img: "img/avatar.jpg",
    desc: "Позинг: персонаж поставлен в позу в Blender, потом обработан и собран в единую композицию: неон, плёнка, глитч." },
  { title: "Бот-анкета для сообщества", tag: "telegram-бот", img: "",
    desc: "Принимает анкеты, проверяет их по правилам и пересылает администраторам. Работает несколько месяцев." },
  { title: "Это мини-приложение", tag: "telegram mini app", img: "",
    desc: "Бот с приложением внутри: услуги, работы и форма заявки, которая приходит прямо в Telegram." },
  { title: "Логотип RQ", tag: "брендинг", img: "img/logo-avatar.svg",
    desc: "Монограмма для псевдонима REquinki по моему эскизу." },
];

const ABOUT = "Здравствуйте! Я Ника, работаю под псевдонимом REquinki. Делаю моушн-дизайн в After Effects, графику для Roblox-игр и Telegram-ботов на Python. Люблю, когда вещь не только красиво выглядит, но и понятно устроена.";

const LINKS = [
  ["Kwork", "https://kwork.ru/", "kwork"],
  ["TikTok", "https://www.tiktok.com/", "tiktok"],
];

/* ===================================================== */

const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor("#04060d"); tg.setBackgroundColor("#04060d"); } catch (e) {} }
const haptic = (t) => { try { tg && tg.HapticFeedback.selectionChanged(); } catch (e) {} };

const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// услуги
document.getElementById("services").innerHTML = SERVICES.map(g => `
  <h2>${esc(g.group)}</h2>
  <div class="card">
    <span class="chip">${esc(g.chip)}</span>
    <p style="margin-bottom:12px">${esc(g.desc)}</p>
    ${g.items.map(([n, p]) => `<div class="row"><span>${esc(n)}</span><span class="price">${esc(p)}</span></div>`).join("")}
  </div>`).join("");

// выбор в форме
const sel = document.getElementById("f-service");
sel.innerHTML = SERVICES.flatMap(g => g.items.map(([n]) => `<option>${esc(g.group)}: ${esc(n)}</option>`)).join("")
  + `<option>Другое</option>`;

// портфолио
function media(w, big) {
  if (w.video) return `<video src="${esc(w.video)}" ${big ? "controls autoplay" : "muted autoplay loop"} playsinline></video>`;
  if (w.img) return `<img src="${esc(w.img)}" alt="" loading="lazy">`;
  return `<div class="ph">// скоро<br>${esc(w.tag)}</div>`;
}
document.getElementById("works").innerHTML = WORKS.map((w, i) => `
  <div class="work" onclick="openWork(${i})">
    <div class="thumb">${media(w, false)}</div>
    <div class="cap">${esc(w.title)}<small>${esc(w.tag)}</small></div>
  </div>`).join("");
function openWork(i) {
  const w = WORKS[i]; haptic();
  document.getElementById("m-media").innerHTML = (w.img || w.video) ? media(w, true) : "";
  document.getElementById("m-title").textContent = w.title;
  document.getElementById("m-desc").textContent = w.desc;
  document.getElementById("modal").classList.add("on");
}
function closeWork() { document.getElementById("modal").classList.remove("on"); document.getElementById("m-media").innerHTML = ""; }

// обо мне
document.getElementById("about").innerHTML = `<p style="color:var(--text)">${esc(ABOUT)}</p>`;
document.getElementById("links").innerHTML = LINKS.map(([n, u, s]) =>
  `<a href="${esc(u)}" onclick="return openLink(this.href)">${esc(n)}<span>${esc(s)} ↗</span></a>`).join("");
function openLink(u) { if (tg && tg.openLink) { tg.openLink(u); return false; } return true; }

// вкладки
function go(tab) {
  haptic();
  document.querySelectorAll("section").forEach(s => s.classList.toggle("on", s.id === "s-" + tab));
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  window.scrollTo({ top: 0, behavior: "smooth" });
}

if (location.hash.length > 1) go(location.hash.slice(1));

// заявка
function sendOrder() {
  const err = document.getElementById("f-err");
  const data = {
    service: sel.value,
    task: document.getElementById("f-task").value.trim(),
    budget: document.getElementById("f-budget").value.trim(),
    deadline: document.getElementById("f-deadline").value.trim(),
  };
  if (data.task.length < 10) { err.textContent = "Опишите задачу хотя бы парой предложений."; return; }
  err.textContent = "";

  // sendData работает, только если приложение открыто кнопкой под полем ввода в чате с ботом
  const viaKeyboard = tg && tg.initData !== undefined && !(tg.initDataUnsafe && tg.initDataUnsafe.query_id) && tg.platform !== "unknown";
  if (viaKeyboard) {
    try { tg.HapticFeedback.notificationOccurred("success"); } catch (e) {}
    tg.sendData(JSON.stringify(data));   // Telegram закроет приложение сам
    return;
  }
  if (tg && tg.platform !== "unknown") {
    err.textContent = "Откройте приложение кнопкой «✨ Открыть» внизу чата с ботом, тогда заявка дойдёт.";
    return;
  }
  // открыто в обычном браузере — просто показываем, как это выглядит
  document.getElementById("order-form").style.display = "none";
  document.getElementById("order-done").style.display = "block";
}
</script>
</body>
</html>
