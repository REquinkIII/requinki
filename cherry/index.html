<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cherry Blossoms</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07040a; --card:rgba(38,12,36,.55); --ink:#ffeaf4; --soft:#b892a8; --line:rgba(255,79,163,.24);
  --neon:#ff4fa3; --neon2:#ff9ccb; --violet:#b07bff; --ok:#6ff0b0; --bad:#ff6b8b;
  --glow:0 0 12px rgba(255,79,163,.65),0 0 32px rgba(255,79,163,.3);
  --mono:"JetBrains Mono",ui-monospace,monospace; --branch:#b07bff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15.5px/1.6 Inter,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 150px;position:relative;z-index:1}

/* фон: свечение, большие неоновые цветки, падающие лепестки */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:radial-gradient(circle at 50% 12%,rgba(255,79,163,.22),transparent 55%),radial-gradient(circle at 90% 85%,rgba(176,123,255,.16),transparent 50%)}
.bloom{position:absolute;filter:drop-shadow(0 0 6px var(--neon)) drop-shadow(0 0 16px rgba(255,79,163,.6));animation:sway 9s ease-in-out infinite alternate}
.bloom svg{width:100%;height:100%;overflow:visible}
.bloom path{fill:rgba(255,79,163,.05);stroke:var(--neon);stroke-width:1.6;stroke-linejoin:round}
.bloom circle{fill:var(--neon2)}
@keyframes sway{to{transform:rotate(14deg) scale(1.04)}}
.petal{position:absolute;top:-30px;width:14px;height:12px;border:1.5px solid var(--neon);border-radius:14px 0 14px 0;box-shadow:0 0 8px var(--neon),inset 0 0 5px rgba(255,79,163,.6);animation:fall linear infinite}
.petal.v{border-color:var(--violet);box-shadow:0 0 8px var(--violet),inset 0 0 5px rgba(176,123,255,.6)}
@keyframes fall{to{transform:translate(-90px,112vh) rotate(600deg)}}
@media (prefers-reduced-motion:reduce){.bloom{animation:none}.petal{display:none}}

/* шапка */
.hero{text-align:center;padding:26px 0 2px}
.logo{display:block;width:100%;max-width:400px;margin:18px auto 0;color:#fff0f7;overflow:visible}
.logo g{filter:drop-shadow(0 0 4px rgba(255,79,163,.9)) drop-shadow(0 0 14px rgba(255,79,163,.55))}
.logo line{stroke:var(--neon);opacity:.8}
.logo path[fill="#eaa3b6"]{fill:rgba(255,79,163,.14);stroke:var(--neon);filter:drop-shadow(0 0 4px var(--neon))}
.logo [fill="#c56b86"]{fill:var(--neon2)}
.logo [stroke="#c56b86"]{stroke:var(--neon2)}
.logo path[fill="none"]{filter:drop-shadow(0 0 4px var(--violet))}
.title{font-family:"Marck Script",cursive;font-weight:400;font-size:46px;line-height:1.05;margin:0;color:#fff0f7;
  text-shadow:0 0 6px rgba(255,79,163,.9),0 0 22px rgba(255,79,163,.6)}
.rule{height:1px;margin:10px auto 6px;width:70%;background:linear-gradient(90deg,transparent,var(--neon),transparent);box-shadow:0 0 8px var(--neon)}
.kicker{text-align:center;font-family:var(--mono);color:var(--neon2);font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:16px}

/* прогресс */
.progress{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 75%,transparent);padding:12px 16px 10px;margin:0 -16px}
.bar{height:4px;border-radius:4px;background:rgba(255,79,163,.15);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--neon));box-shadow:0 0 10px var(--neon);border-radius:4px;transition:width .4s}
.step{font-family:var(--mono);font-size:11px;color:var(--soft);margin-top:6px;display:flex;justify-content:space-between;letter-spacing:.06em}
.step span:first-child{color:var(--neon2)}

/* карточки */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 18px 14px;margin:14px 0;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.card h3{margin:4px 0 8px;font-family:var(--mono);font-size:12.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--neon2);display:flex;align-items:center;gap:10px}
.card h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.card p{margin:0 0 10px}
.card ul{margin:0 0 6px;padding:0;list-style:none}
.card li{padding:4px 0 4px 24px;position:relative}
.card li::before{content:"✿";position:absolute;left:0;top:4px;color:var(--neon);font-size:14px;text-shadow:0 0 8px var(--neon)}
.note{font-size:14px;color:var(--soft)}
b{color:#fff;font-weight:600}
a{color:var(--neon2)}

/* расписание */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:6px 0 12px}
.day{border-radius:10px;padding:8px 0;text-align:center;font-family:var(--mono);font-size:11px;color:var(--soft);border:1px solid var(--line)}
.day b{display:block;font-size:13px;color:var(--soft)}
.day.on{border-color:var(--neon);color:#fff;box-shadow:var(--glow);background:rgba(255,79,163,.18)}
.day.on b{color:#fff}
.day.purge{border-color:var(--violet);color:#fff;box-shadow:0 0 12px rgba(176,123,255,.6),0 0 28px rgba(176,123,255,.25);background:rgba(176,123,255,.16)}
.day.purge b{color:#fff}
.legend{font-family:var(--mono);font-size:11px;color:var(--soft);display:flex;align-items:center;gap:6px;margin:-4px 0 8px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-left:6px}
.dot:first-child{margin-left:0}
.dot.on{background:var(--neon);box-shadow:0 0 6px var(--neon)}
.dot.purge{background:var(--violet);box-shadow:0 0 6px var(--violet)}

/* администрация */
.admin{display:flex;gap:14px;align-items:flex-start}
.avatar{flex:0 0 48px;height:48px;border-radius:50%;border:1.5px solid var(--neon);box-shadow:var(--glow),inset 0 0 10px rgba(255,79,163,.5);display:flex;align-items:center;justify-content:center;font-family:"Marck Script",cursive;font-size:26px;color:#fff0f7;text-shadow:0 0 8px var(--neon)}
.role{font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--neon2);margin-top:1px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.tag{font-size:12px;border:1px solid var(--line);color:var(--ink);border-radius:20px;padding:2px 10px;background:rgba(255,79,163,.07)}

/* проверка */
.q{margin:0 0 14px}
.q .ask{font-weight:600;margin-bottom:8px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:rgba(10,4,14,.6);border-radius:12px;padding:11px 14px;margin:6px 0;font:inherit;color:var(--ink);cursor:pointer;transition:border-color .15s,box-shadow .15s}
.opt.sel{border-color:var(--neon);box-shadow:0 0 0 1px var(--neon),0 0 14px rgba(255,79,163,.45);background:rgba(255,79,163,.12)}
.opt[disabled]{opacity:.6}
.msg{border-radius:12px;padding:12px 14px;margin:12px 0;font-size:14.5px;border:1px solid}
.msg.bad{color:var(--bad);border-color:rgba(255,107,139,.45);background:rgba(255,107,139,.08)}
.msg.ok{color:var(--ok);border-color:rgba(111,240,176,.45);background:rgba(111,240,176,.07)}

/* форма */
label{display:block;font-family:var(--mono);font-size:11px;color:var(--neon2);text-transform:uppercase;letter-spacing:.08em;margin:16px 0 6px}
label small{text-transform:none;letter-spacing:0;color:var(--soft);font-family:Inter,sans-serif;font-size:12px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:rgba(10,4,14,.85);border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}
input:focus,textarea:focus{border-color:var(--neon);box-shadow:0 0 0 3px rgba(255,79,163,.2)}
textarea{min-height:100px;resize:vertical}
.count{font-family:var(--mono);font-size:11px;color:var(--ok);text-align:right;margin-top:4px}
.count.low{color:var(--soft)}
.err{font-size:13px;color:var(--bad);margin-top:5px;display:none}
.field.invalid input,.field.invalid textarea{border-color:var(--bad);box-shadow:0 0 10px rgba(255,107,139,.35)}
.field.invalid .err{display:block}
.pick{display:flex;align-items:center;justify-content:center;gap:10px;min-height:64px;border:1.5px dashed var(--neon);border-radius:12px;padding:10px;cursor:pointer;color:var(--neon2);font-family:Inter,sans-serif;font-size:14px;text-transform:none;letter-spacing:0;background:rgba(255,79,163,.06)}
.pick img{max-height:140px;max-width:60%;border-radius:8px;box-shadow:var(--glow)}
.field.invalid .pick{border-color:var(--bad)}
.check{display:flex;gap:10px;align-items:center;margin:10px 0}
.check input{width:20px;height:20px;accent-color:var(--neon)}

/* нижняя кнопка */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:6;background:linear-gradient(to top,var(--bg) 65%,transparent);padding:20px 16px calc(14px + env(safe-area-inset-bottom))}
.foot .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:12px;padding:15px;font:600 15.5px Inter,sans-serif;background:var(--neon);color:#fff;cursor:pointer;box-shadow:var(--glow);transition:background .2s,box-shadow .2s}
.btn:active{transform:scale(.98)}
.btn[disabled]{background:rgba(255,79,163,.16);color:var(--soft);box-shadow:none;cursor:default;font-family:var(--mono);font-size:13px}
.btn.ghost{flex:0 0 auto;background:transparent;color:var(--neon2);border:1px solid var(--neon);box-shadow:none;padding:15px 18px}
/* Черрик — неоновый кот, сидит на краю кнопки и реагирует на ответы */
.cat{position:fixed;right:max(14px,calc(50% - 266px));bottom:calc(64px + env(safe-area-inset-bottom));width:54px;height:62px;z-index:7;cursor:pointer;-webkit-tap-highlight-color:transparent}
.cat svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 2.5px #ff4fa3) drop-shadow(0 0 8px rgba(255,79,163,.7))}
.cat path,.cat line{fill:none;stroke:#ff8fc4;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.cat .eyes circle{fill:#ff4fa3;stroke:none;filter:drop-shadow(0 0 2px #ff4fa3) drop-shadow(0 0 5px #ff4fa3)}
.cat .whisk{stroke-width:1.1;opacity:.8}
.cat .body{animation:breathe 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
.cat .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
.cat .tail{transform-box:fill-box;transform-origin:0% 100%;animation:swish 2.4s ease-in-out infinite alternate}
.cat .earL,.cat .earR{transform-box:fill-box;transition:transform .35s}
.cat .earL{transform-origin:100% 100%}.cat .earR{transform-origin:0% 100%}
.cat .happyEyes,.cat .sadEyes,.cat .tear{opacity:0;transition:opacity .2s}
@keyframes breathe{50%{transform:scaleY(1.035)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes swish{from{transform:rotate(-14deg)}to{transform:rotate(22deg)}}
/* случайные «живые» движения в покое */
.cat.tilt .head{animation:tilt 1.6s ease-in-out}
.cat.twitch .earR{animation:twitch .5s ease-in-out 2}
.cat.look .eyes{animation:look 2s ease-in-out}
.cat.flick .tail{animation:flick .9s ease-in-out}
.cat.wiggle{animation:wiggle 1s ease-in-out}
@keyframes tilt{30%,70%{transform:rotate(-14deg)}}
@keyframes twitch{50%{transform:rotate(22deg)}}
@keyframes look{20%,45%{transform:translateX(-2.4px)}60%,85%{transform:translateX(2.4px)}}
@keyframes flick{0%{transform:rotate(0)}30%{transform:rotate(45deg)}60%{transform:rotate(-20deg)}100%{transform:rotate(0)}}
@keyframes wiggle{20%{transform:translateY(-7px)}40%{transform:translateY(0)}60%{transform:translateY(-4px)}80%{transform:translateY(0)}}
/* радуется */
.cat.happy{animation:hop .55s ease-out 2}
.cat.happy .eyes{opacity:0}.cat.happy .happyEyes{opacity:1}
.cat.happy .tail{animation-duration:.35s}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-16px) scale(1.04)}70%{transform:translateY(2px) scaleY(.95)}}
/* грустит */
.cat.sad{animation:sigh .5s ease-in-out}
.cat.sad .eyes{opacity:0}.cat.sad .sadEyes,.cat.sad .tear{opacity:1}
.cat.sad .earL{transform:rotate(-38deg)}.cat.sad .earR{transform:rotate(38deg)}
.cat.sad .tail{animation:none;transform:rotate(55deg)}
.cat.sad .tear{animation:drip 1.4s ease-in infinite}
@keyframes sigh{20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(1px)}}
@keyframes drip{from{transform:translateY(0)}to{transform:translateY(7px);opacity:0}}
/* реплика над котом */
.bubble{position:fixed;right:max(14px,calc(50% - 266px));bottom:calc(132px + env(safe-area-inset-bottom));z-index:7;max-width:210px;
  background:#160714;border:1px solid var(--neon);border-radius:14px 14px 4px 14px;padding:7px 11px;font-size:13.5px;line-height:1.35;color:#fff0f7;
  box-shadow:0 0 12px rgba(255,79,163,.45);opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s;pointer-events:none}
.bubble.on{opacity:1;transform:none}
.heart{position:fixed;z-index:7;pointer-events:none;color:#ff4fa3;font-size:15px;text-shadow:0 0 8px #ff4fa3;animation:float 1.3s ease-out forwards}
@keyframes float{to{transform:translate(var(--dx),-70px) scale(1.3);opacity:0}}
/* затискали: мотает головой */
.cat .head{transform-box:fill-box;transform-origin:50% 95%}
.cat .angryEyes{opacity:0;transition:opacity .15s}
.cat.annoyed .head{animation:nope .32s ease-in-out 4}
.cat.annoyed .eyes,.cat.annoyed .happyEyes,.cat.annoyed .sadEyes,.cat.annoyed .tear{opacity:0}
.cat.annoyed .angryEyes{opacity:1}
.cat.annoyed .earL{transform:rotate(-55deg)}.cat.annoyed .earR{transform:rotate(55deg)}
.cat.annoyed .tail{animation:swish .18s ease-in-out infinite alternate}
@keyframes nope{25%{transform:rotate(-16deg)}75%{transform:rotate(16deg)}}
/* обиделся: сидит спиной */
.cat.sulk svg{transform:scaleX(-1)}
.cat.sulk .head > :not(.earL):not(.earR):not(path:nth-child(3)){opacity:0}
.cat.sulk .tail{animation:none;transform:rotate(55deg)}
@media (prefers-reduced-motion:reduce){.cat,.cat *{animation:none!important}}
.fade{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}

/* ===== Анки — андроид-регистратор: сидит внизу слева, отвечает по делу ===== */
.anki{position:fixed;left:max(14px,calc(50% - 266px));bottom:calc(64px + env(safe-area-inset-bottom));width:50px;height:62px;z-index:7;cursor:pointer;animation:hover 3.6s ease-in-out infinite}
.anki svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 2.5px #ff4fa3) drop-shadow(0 0 8px rgba(255,79,163,.7))}
.anki path,.anki rect,.anki line{fill:none;stroke:#ff8fc4;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.anki .scr{fill:rgba(255,79,163,.16)}
.anki .fl{fill:#ff4fa3;stroke:none;filter:drop-shadow(0 0 3px #ff4fa3)}
.anki .cheek{fill:rgba(255,79,163,.6);stroke:none}
.anki .e-ok,.anki .e-sad,.anki .tearA,.anki .m-sad{opacity:0;transition:opacity .15s}
.anki .e-norm{transform-box:fill-box;transform-origin:center;animation:ablink 5.2s infinite}
.anki.a-ok .e-norm,.anki.a-sad .e-norm,.anki.a-sad .m-norm{opacity:0}.anki.a-ok .e-ok{opacity:1}
.anki.a-sad .e-sad,.anki.a-sad .m-sad,.anki.a-sad .tearA{opacity:1}
.anki .tearA{fill:#9fd8ff;stroke:none;filter:drop-shadow(0 0 3px #9fd8ff)}
.anki.a-sad .tearA{animation:adrip 1.4s ease-in infinite}
.anki.a-sad .ant{animation:none;transform:rotate(24deg)}
.anki.a-ok{animation:ahop .5s ease-out 2}
.anki.a-sad{animation:asigh 1.2s ease-in-out}
.anki .e-zap{opacity:0}
.anki.a-hot{animation:ashake .3s ease-in-out infinite}
.anki.a-hot svg{animation:ahot .3s steps(2) infinite}
@keyframes ahot{50%{filter:drop-shadow(0 0 3px #ff7a3b) drop-shadow(0 0 14px rgba(255,110,40,.95))}}
.anki.a-zap{animation:aglitch .16s steps(2) infinite}
.anki.a-zap svg{animation:aflick .45s steps(3) infinite}
.anki.a-zap .e-norm,.anki.a-zap .e-ok,.anki.a-zap .e-sad,.anki.a-off .e-norm,.anki.a-off .e-ok{opacity:0}
.anki.a-zap .e-zap,.anki.a-off .e-zap{opacity:1}
.anki.a-off{animation:none;opacity:.35;filter:grayscale(1)}
.anki.a-off .ant{animation:none;transform:rotate(30deg)}
@keyframes aglitch{25%{transform:translate(-3px,1px) skewX(9deg)}50%{transform:translate(2px,-2px)}75%{transform:translate(3px,2px) skewX(-7deg)}}
@keyframes aflick{33%{opacity:.25}66%{opacity:.9;filter:hue-rotate(170deg) drop-shadow(0 0 6px #9fd8ff)}}
.spark{position:fixed;z-index:8;pointer-events:none;color:#ffe066;font-size:15px;text-shadow:0 0 8px #ffd23f;animation:float .9s ease-out forwards}
@keyframes adrip{from{transform:translateY(0)}to{transform:translateY(6px);opacity:0}}
@keyframes asigh{30%{transform:translateY(3px)}}
.anki .ant{transform-box:fill-box;transform-origin:50% 100%;animation:antsway 2.8s ease-in-out infinite alternate}
@keyframes hover{50%{transform:translateY(-4px)}}
@keyframes ablink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.15)}}
@keyframes ahop{40%{transform:translateY(-12px)}}
@keyframes ashake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes antsway{from{transform:rotate(-10deg)}to{transform:rotate(10deg)}}
.wm{position:absolute;left:50%;bottom:9vh;width:min(52vw,240px);transform:translateX(-50%);opacity:.08;
  filter:invert(1) drop-shadow(0 0 10px #ff4fa3)}
.abubble{position:fixed;left:max(14px,calc(50% - 266px));bottom:calc(132px + env(safe-area-inset-bottom));z-index:7;max-width:230px;
  background:#160714;border:1px solid var(--violet);border-radius:14px 14px 14px 4px;padding:7px 11px;font:13px/1.4 var(--mono);color:#f3e8ff;
  box-shadow:0 0 12px rgba(176,123,255,.45);opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s;pointer-events:none}
.abubble.on{opacity:1;transform:none}
.abubble b{color:var(--neon2);font-weight:600}

/* ===== Черрик-шкодник: прячется и выглядывает с краёв экрана ===== */
.peek{position:fixed;z-index:8;width:74px;height:56px;pointer-events:none;transition:transform .55s cubic-bezier(.34,1.56,.64,1)}
.peek.on{pointer-events:auto}
.peek .cat{position:static;width:100%;height:100%}
.peek .cat .body,.peek .cat .tail{display:none}
.bubble.free{right:auto;bottom:auto;border-radius:14px}

/* ===== заставка: Анки и Черрик знакомятся ===== */
.intro{position:fixed;inset:0;z-index:30;background:radial-gradient(circle at 50% 40%,rgba(255,79,163,.22),transparent 60%),var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;transition:opacity .5s}
.intro.out{opacity:0;pointer-events:none}
.intro .duo{display:flex;align-items:flex-end;gap:34px}
.intro .who{display:flex;flex-direction:column;align-items:center;gap:10px;opacity:0;transform:translateY(18px);transition:opacity .5s,transform .5s cubic-bezier(.34,1.56,.64,1)}
.intro .who.in{opacity:1;transform:none}
.intro .fig{width:96px;height:112px}
.intro .fig svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 4px #ff4fa3) drop-shadow(0 0 14px rgba(255,79,163,.7))}
.intro .fig path,.intro .fig rect,.intro .fig line{fill:none;stroke:#ffd0e6;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.intro .fig .scr{fill:rgba(255,79,163,.16)}.intro .fig .fl{fill:#ff4fa3;stroke:none}.intro .fig .cheek{fill:rgba(255,79,163,.6);stroke:none}
.intro .fig .eyes circle{fill:#ff4fa3;stroke:none}
.intro .fig .e-ok,.intro .fig .e-sad,.intro .fig .e-zap,.intro .fig .tearA,.intro .fig .m-sad,.intro .fig .happyEyes,.intro .fig .sadEyes,.intro .fig .tear,.intro .fig .angryEyes{display:none}
.intro .name{font:600 12px var(--mono);letter-spacing:.2em;color:var(--neon2);text-transform:uppercase}
.intro .lines{min-height:96px;max-width:330px;width:100%;display:flex;flex-direction:column;gap:8px}

const WELCOME = `
<p>❮ Привет-привет! На связи администрация клана — <b>Кисари, Верс, Тайга, Арлекин и Рекви</b>. Рады видеть тебя в нашем уютном уголке! ❯</p>
<p>Мы строим не просто клан по Evade, а место с по-настоящему тёплой атмосферой.</p>
<p>Мы не стремимся к огромным цифрам и к большой толпе. Для нас важно качество и комфорт каждого. Мы ценим своих людей, за которыми легко уследить и с которыми приятно проводить время.</p>
<h3>Чего мы ждём?</h3>
<ul><li>Активности и позитива.</li><li>Искреннего интереса к жизни клана.</li><li>Комфортного общения без токсичности.</li></ul>
<p class="note">Дальше — правила, информация о съёмках, состав администрации и анкета. Правила нужно именно прочитать: после каждой части будет пара вопросов. Ошибёшься — вернёшься перечитать.</p>
<p class="note">Внизу слева — <b>Анки</b>, андроид-регистратор: подскажет по каждому шагу. А <b>Черрик</b>… где-то прячется. Найдёшь — погладь 🐾</p>`;

// Порядок экранов. type: "read" — текст, "quiz" — проверка по предыдущим блокам.
const STEPS = [
  {type:"read", section:"Самое важное", title:"Самое важное", html:`<p>Здесь собрана ключевая информация, которая есть только в этом разделе. Правила у многих проектов похожи, поэтому здесь вы быстро найдёте то, что отличает именно наш. Основные правила тоже обязательны к прочтению.</p><ul><li>Возрастное ограничение: <b>16+</b>.</li><li>Норма активности: <b>150 сообщений в неделю</b>.</li><li>Чистка проходит <b>каждое воскресенье в 20:00 по МСК</b>.</li><li>Если вы вступили <b>менее чем за 5 дней до чистки</b>, вы считаетесь новым участником и под эту чистку не попадаете.</li><li>Неактив допускается <b>не более 3 дней</b>. После этого участник исключается из проекта, если не предупредил администрацию заранее.</li><li>Съёмки проводятся <b>только на Discord-сервере</b>.</li><li>Анкету вы заполните в конце этого приложения — рассчитываем на ваше хорошее заполнение.</li></ul>`},
  {type:"quiz", section:"Самое важное", pick:2, pool:[
    {q:"Какая норма сообщений в неделю?", a:["150", "50", "300"]},
    {q:"Когда проходят чистки?", a:["В воскресенье в 20:00 по МСК", "В субботу в 19:00 по МСК", "Каждый день в полночь"]},
    {q:"Сколько дней максимум можно быть в неактиве?", a:["3 дня", "Неделю", "Сколько угодно"]},
    {q:"Тебя не будет 5 дней. Как не вылететь из проекта?", a:["Заранее предупредить администрацию", "Ничего не делать — вернусь и продолжу", "Написать 150 сообщений после возвращения"]},
    {q:"С какого возраста принимают в клан?", a:["С 16 лет", "С 14 лет", "С 18 лет"]},
    {q:"Где проходят съёмки?", a:["Только на Discord-сервере", "В голосовом чате Roblox", "В Telegram"]},
    {q:"Когда ты считаешься новым участником на чистке?", a:["Если вступил менее чем за 5 дней до неё", "Если вступил за 1 день до неё", "Новичков не бывает, норма для всех"]},
  ]},

  {type:"read", section:"Основные правила", title:"Уважение", html:`<p>Добро пожаловать! Это место для свободного общения, обмена новостями, шутками и просто приятного времяпровождения. Чтобы всем было комфортно, пожалуйста, соблюдайте следующие правила.</p><h3>1. Уважение и доброжелательность</h3><ul><li><b>1.1.</b> Относитесь с уважением ко всем участникам. Не допускаются оскорбления, унижения, переход на личности, агрессия и травля.</li><li><b>1.2.</b> Запрещена дискриминация в любой форме: по расе, национальности, религии, полу, возрасту, сексуальной ориентации и т.д.</li><li><b>1.3.</b> Будьте вежливы: простые «пожалуйста» и «спасибо» делают общение приятнее.</li><li><b>1.4.</b> Не провоцируйте конфликты и не подталкивайте других к нарушению правил.</li></ul>`},
  {type:"read", section:"Основные правила", title:"Запрещённый контент", html:`<h3>2. Запрещённый контент</h3><ul><li><b>2.1.</b> Реклама и самореклама без согласования с администрацией, включая ссылки на сторонние ресурсы, сообщества, группы и коммерческие предложения.</li><li><b>2.2.</b> Спам: повторная отправка одинаковых или бессмысленных сообщений, изображений и ссылок.</li><li><b>2.3.</b> «Лесенки»: несколько коротких сообщений подряд (например, по одному слову), которые можно было написать одним сообщением.</li><li><b>2.4.</b> Материалы порнографического, насильственного или иного незаконного характера.</li><li><b>2.5.</b> Чужие личные данные (адреса, телефоны, документы и т.п.) без явного согласия их владельца.</li><li><b>2.6.</b> Клевета и ложная информация об участниках или администрации.</li></ul>`},
  {type:"quiz", section:"Основные правила", pick:2, pool:[
    {q:"Что такое «лесенка»?", a:["Несколько коротких сообщений подряд вместо одного", "Длинное сообщение со списком", "Ответ на чужое сообщение"]},
    {q:"Ты пишешь «привет», «как», «дела» тремя отдельными сообщениями. Это…", a:["Нарушение — «лесенка»", "Нормально, так быстрее", "Нарушение — спам ссылками"]},
    {q:"Можно ли скинуть в чат ссылку на свой канал или сервер?", a:["Только по согласованию с администрацией", "Да, если он интересный", "Да, но не чаще раза в день"]},
    {q:"Что из этого — спам?", a:["Отправить одно и то же сообщение много раз подряд", "Сказать «спасибо» за помощь", "Пошутить в общем чате"]},
    {q:"Можно ли выложить в чат чужой номер телефона или адрес?", a:["Нет, без явного согласия владельца нельзя", "Да, если это шутка", "Да, если человек нарушил правила"]},
    {q:"Участник подбивает других поругаться с кем-то. Это…", a:["Нарушение — провокация конфликта", "Нормально, если без мата", "Его личное дело"]},
    {q:"Можно ли распространять слухи про администратора?", a:["Нет, это клевета", "Да, если это «наверное» правда", "Да, в личных сообщениях"]},
  ]},

  {type:"read", section:"Основные правила", title:"Общение и порядок", html:`<h3>3. Общение и порядок</h3><ul><li><b>3.1.</b> Используйте стикеры, эмодзи и медиафайлы умеренно: их избыток мешает читать чат.</li><li><b>3.2.</b> Выражайте мнение спокойно и аргументированно. Если спор накаляется, лучше сделать паузу или продолжить в личных сообщениях. Вы всегда можете обратиться к администрации за помощью.</li><li><b>3.3.</b> Общий сбор (калл) можно использовать только по согласованию с администрацией.</li></ul>`},
  {type:"read", section:"Основные правила", title:"Администрация", html:`<h3>4. Взаимодействие с администрацией</h3><ul><li><b>4.1.</b> Администрация следит за порядком и может выдавать предупреждения или применять санкции за нарушения. Соблюдайте её указания.</li><li><b>4.2.</b> Не спорьте с администрацией в общем чате. Вопросы и претензии пишите администратору в личные сообщения.</li><li><b>4.3.</b> Администрация не может видеть всё. Если заметили нарушение, сообщите администратору.</li></ul>`},
  {type:"quiz", section:"Основные правила", pick:2, pool:[
    {q:"Спор в чате накаляется. Что делать?", a:["Сделать паузу или продолжить в личных сообщениях", "Доказать свою правоту до конца", "Позвать друзей на свою сторону"]},
    {q:"Хочешь собрать всех в калл. Как правильно?", a:["Сначала согласовать с администрацией", "Просто отметить всех", "Нельзя ни при каких условиях"]},
    {q:"Не согласен с решением администратора. Что делать?", a:["Написать администратору в личные сообщения", "Обсудить это в общем чате", "Игнорировать его указания"]},
    {q:"Сколько стикеров и гифок можно отправлять?", a:["Умеренно, чтобы не мешать читать чат", "Сколько угодно", "Они запрещены"]},
    {q:"Ты заметил нарушение в чате. Что делать?", a:["Сообщить администратору", "Самому наказать нарушителя", "Ничего, админы и так всё видят"]},
  ]},

  {type:"read", section:"Основные правила", title:"Наказания", html:`<h3>5. Ответственность за нарушения</h3><p><b>5.1.</b> За нарушение правил администрация может применить:</p><ul><li>устное предупреждение;</li><li>письменное предупреждение;</li><li>мут (временный запрет на отправку сообщений);</li><li>кик (временное исключение из чата);</li><li>бан (постоянное исключение из чата).</li></ul><p><b>5.2.</b> Мера наказания зависит от тяжести нарушения, его частоты и обстоятельств.</p>`},
  {type:"read", section:"Основные правила", title:"Важно помнить", html:`<h3>6. Важно помнить</h3><p>Чат — это пространство для общения. Давайте делать его позитивным и приятным для всех.</p><p class="note">Спасибо за понимание и приятного общения!</p>`},
  {type:"quiz", section:"Основные правила", pick:2, pool:[
    {q:"Что из этого НЕ наказание в нашем клане?", a:["Штраф в робуксах", "Мут", "Кик"]},
    {q:"Какое наказание самое строгое?", a:["Бан — постоянное исключение из чата", "Письменное предупреждение", "Мут"]},
    {q:"Что такое мут?", a:["Временный запрет на отправку сообщений", "Постоянное исключение из чата", "Устное замечание"]},
    {q:"От чего зависит мера наказания?", a:["От тяжести нарушения, его частоты и обстоятельств", "От настроения администратора", "Всегда одинаковая"]},
  ]},

  {type:"read", section:"Съёмки", title:"Расписание съёмок", html:`
    <div class="days">
      <div class="day"><b>Пн</b>—</div><div class="day on"><b>Вт</b>19:00</div><div class="day"><b>Ср</b>—</div>
      <div class="day"><b>Чт</b>—</div><div class="day"><b>Пт</b>—</div><div class="day on"><b>Сб</b>19:00</div><div class="day purge"><b>Вс</b>20:00</div>
    </div>
    <p class="legend"><span class="dot on"></span>съёмки <span class="dot purge"></span>чистка</p>
    <ul>
      <li>Съёмки: <b>вторник и суббота в 19:00</b>. Остальные дни — отдых.</li>
      <li>Чистка: <b>воскресенье в 20:00</b>.</li>
      <li>Время всегда <b>московское</b>.</li>
      <li>Возможны переносы, о них сообщим заранее.</li>
      <li>Убедитесь, что вам подходит это время, <b>до</b> вступления в клан.</li>
    </ul>`},
  {type:"read", section:"Съёмки", title:"Discord-сервер", html:`<h3>1. Общие правила</h3><ul><li><b>1.1.</b> Запрещены оскорбительные никнеймы, аватары с элементами 18+, а также ники, копирующие ники администрации.</li><li><b>1.2.</b> Не тегайте администрацию без причины.</li><li><b>1.3.</b> Массовые упоминания (@everyone, @here) можно использовать только с разрешения администрации.</li><li><b>1.4.</b> Соблюдайте тематику каналов: игры — в «комнате», съёмки — в «съёмках», личные разговоры — в «привате».</li></ul><h3>2. Голосовые каналы</h3><ul><li><b>2.1.</b> Настройте микрофон так, чтобы не было слышно дыхания, эха и клавиатуры. Помогут «режим рации» или «подавление шума».</li><li><b>2.2.</b> Запрещено записывать голоса участников без их согласия. Исключение — официальные съёмки проекта.</li></ul><h3>3. Безопасность и реклама</h3><ul><li><b>3.1.</b> Реклама сторонних серверов, каналов или услуг без согласования с владельцем наказывается предупреждением.</li><li><b>3.2.</b> Попытки взлома, фишинг и распространение вредоносных ссылок караются <b>немедленным баном</b>.</li></ul>`},
  {type:"read", section:"Съёмки", title:"Поведение на съёмках", html:`<h3>4. Дисциплина и пунктуальность</h3><ul><li><b>4.1.</b> Если вы отметились, что придёте на съёмки, приходите <b>не позднее чем за 10 минут до начала</b>.</li><li><b>4.2.</b> Заранее проверьте интернет, микрофон и настройки игры. К началу всё должно работать «в один клик».</li></ul><h3>5. Поведение в кадре и в микрофоне</h3><ul><li><b>5.1.</b> Когда говорит ведущий, остальные молчат. Перебивать нельзя.</li><li><b>5.2.</b> Если микрофон включён, не кликайте мышкой, не ешьте, не шуршите пакетами и не разговаривайте с домашними.</li><li><b>5.3.</b> Если у съёмки есть план, придерживайтесь его. Импровизация приветствуется, если не ломает логику видео.</li><li><b>5.4.</b> Во время записи не отвлекайтесь на телефон или другие игры. Если вы в кадре, вы заняты.</li></ul><h3>6. Срыв съёмок</h3><p><b>6.1.</b> Участник, который намеренно мешает съёмкам (троллит, кричит, портит кадр), получает <b>мут в Discord и предупреждение в Telegram-чате</b>.</p>`},

const SAVE_KEY = "cb_progress_v1";

let pos = -1;           // -1 = приветствие
let reached = -1;       // самый дальний пройденный шаг
let mistakes = 0;       // всего ошибок в проверках (видят админы)
let lastAsked = {};     // какие вопросы были в прошлый раз на этой проверке
let timer = null, form = {};

function load(){ try{ const s = JSON.parse(localStorage.getItem(SAVE_KEY)||"null"); if(s){ reached=s.reached; mistakes=s.mistakes||0; form=s.form||{}; pos=Math.min(s.pos, reached+1); } }catch(e){} }
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify({pos,reached,mistakes,form})); }catch(e){} }

const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// первый блок группы, к которой относится проверка
function groupStart(i){ let j=i-1; while(j>0 && STEPS[j-1].type==="read") j--; return j; }

function setProgress(){
  const p = $("#progress");
  if (pos < 0){ p.hidden = true; return; }
  p.hidden = false;
  $("#barFill").style.width = Math.round((pos+1)/STEPS.length*100)+"%";
  $("#stepName").textContent = STEPS[pos].section;
  $("#stepNum").textContent = (pos+1)+" / "+STEPS.length;
}

function header(title, kicker, logo){
  if (logo) return `<div class="hero">${LOGO}</div><div class="kicker">${kicker}</div>`;
  return `<div class="hero"><h1 class="title">${title}</h1></div><div class="rule"></div><div class="kicker">${kicker}</div>`;
}

// «Дальше» открывается, когда текст долистан до конца и прошло время на чтение
function gateReading(chars){
  let left = Math.round(Math.min(15, Math.max(10, chars/40)));   // 10–15 секунд в зависимости от длины
  let scrolled = false;
  const check = () => {
    if (!scrolled && window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 140) scrolled = true;
    if (left > 0){ nextBtn.disabled = true; nextBtn.textContent = `Читай… ${left} с`; }
    else if (!scrolled){ nextBtn.disabled = true; nextBtn.textContent = "Долистай до конца ↓"; }
    else { nextBtn.disabled = false; nextBtn.textContent = "Прочитал(а), дальше"; }
  };
  window.onscroll = check;
  timer = setInterval(()=>{ left--; check(); if(left<=0 && scrolled){ clearInterval(timer); } }, 1000);
  check();
}

function render(){
  clearInterval(timer); window.onscroll = null; window.scrollTo(0,0);
  setProgress(); save();
  backBtn.style.display = pos < 0 ? "none" : "";
  nextBtn.disabled = false;

  if (pos < 0){
    screen.innerHTML = header("Cherry Blossoms","добро пожаловать","logo") + `<div class="card fade">${WELCOME}</div>`;
    nextBtn.textContent = reached >= 0 ? "Продолжить с места, где остановился" : "Начать";
    nextBtn.onclick = () => go(reached >= 0 ? Math.min(reached+1, STEPS.length-1) : 0);
    return;
  }
  const s = STEPS[pos];
  ankiHint(s);
  if (s.type === "read")  return renderRead(s);
  if (s.type === "quiz")  return renderQuiz(s);
  if (s.type === "admins")return renderAdmins(s);
  if (s.type === "form")  return renderForm(s);
  if (s.type === "done")  return renderDone(s);
}

function renderRead(s){
  screen.innerHTML = header(s.section, "прочитай внимательно") + `<div class="card fade">${s.title!==s.section && !s.html.includes("<h3>")?`<h3>${s.title}</h3>`:""}${s.html}</div>`;
  nextBtn.onclick = () => go(pos+1);
  if (pos <= reached){ nextBtn.textContent = "Дальше"; return; }  // уже читал — не заставляем ждать
  gateReading(screen.textContent.length);
}

function renderQuiz(s){
  if (pos <= reached){   // вернулся назад на уже пройденную проверку
    screen.innerHTML = header(s.section, "проверка") + `<div class="card fade"><div class="msg ok">Эта проверка уже пройдена ✿</div></div>`;
    nextBtn.textContent = "Дальше"; nextBtn.onclick = () => go(pos+1); return;
  }
  // в этот раз — другие вопросы, чем в прошлый, если хватает
  const prev = lastAsked[pos] || [];
  let fresh = s.pool.filter(x => !prev.includes(x.q));
  if (fresh.length < s.pick) fresh = s.pool;
  const qs = shuffle(fresh).slice(0, s.pick);
  lastAsked[pos] = qs.map(x=>x.q);

  const answers = {};
  screen.innerHTML = header(s.section, "проверка") + `<div class="card fade">
    <p class="note">Ответь на ${qs.length === 2 ? "два вопроса" : qs.length+" вопроса"} по тому, что только что прочитал(а).</p>
    ${qs.map((x,i)=>`<div class="q"><div class="ask">${i+1}. ${esc(x.q)}</div>${shuffle(x.a).map(a=>`<button class="opt" data-q="${i}">${esc(a)}</button>`).join("")}</div>`).join("")}
    <div id="qmsg"></div></div>`;
  screen.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    screen.querySelectorAll(`.opt[data-q="${b.dataset.q}"]`).forEach(o=>o.classList.remove("sel"));
    b.classList.add("sel"); answers[b.dataset.q] = b.textContent;
    nextBtn.disabled = Object.keys(answers).length < qs.length;
  });
  nextBtn.textContent = "Проверить"; nextBtn.disabled = true;
  nextBtn.onclick = () => {
    const wrong = qs.filter((x,i)=> answers[i] !== x.a[0]).length;
    if (!wrong){
      $("#qmsg").innerHTML = `<div class="msg ok">Всё верно ✿</div>`;
      anki("ok", ANKI_OK[Math.random()*ANKI_OK.length|0]); if (Math.random() < .5) setTimeout(() => cat("happy", PRAISE[Math.random()*PRAISE.length|0]), 900);
      $("#qmsg").scrollIntoView({behavior:"smooth",block:"center"});
      nextBtn.textContent = "Дальше"; nextBtn.onclick = () => go(pos+1);
      reached = Math.max(reached, pos); save();
    } else {
      mistakes += wrong; save();
      const to = groupStart(pos);
      $("#qmsg").innerHTML = `<div class="msg bad">Неверных ответов: ${wrong}. Перечитай этот раздел — вопросы в следующий раз будут другие.</div>`;
      anki("sad", `Ошибок: <b>${wrong}</b>. Возвращаю к началу раздела — перечитай, вопросы будут другие.`, 4200);
      $("#qmsg").scrollIntoView({behavior:"smooth",block:"center"});
      screen.querySelectorAll(".opt").forEach(o=>o.disabled=true);
      nextBtn.textContent = "Перечитать"; nextBtn.onclick = () => { reached = Math.min(reached, to-1); go(to); };
    }
  };
}

function renderAdmins(s){
  screen.innerHTML = header("Администрация","кто за всё отвечает") + `
    <div class="card fade"><p>Администрация — это люди, отвечающие за проект. Они следят за правилами, принимают новых участников и помогают тем, кому не удалось легко влиться в коллектив. Им всегда можно предложить идею для улучшения проекта.</p></div>
    ${ADMINS.map(a=>`<div class="card fade admin"><div class="avatar">${esc(a.name[0])}</div><div><b>${esc(a.name)}</b><div class="role">${esc(a.role)}</div><div class="tags">${a.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div></div></div>`).join("")}`;
  nextBtn.onclick = () => { reached = Math.max(reached,pos); go(pos+1); };
  if (pos <= reached){ nextBtn.textContent = "Дальше"; return; }
  gateReading(200);
}

function payload(skinUrl){
  const v = id => (form[id]||"").trim();
  return { v:1, mistakes, skin: skinUrl || "", a:{ name:v("name"), nick:v("nick"), rbx:v("rbx"), age:v("age"), tz:v("tz"), lvl:v("lvl"), exp:v("exp"), motiv:v("motiv"), about:v("about"), discord:v("dsname") } };
}

// Фото сжимаем до 1280 px: быстрее грузится и меньше трафика.
// В localStorage оно не сохраняется — если закрыть приложение, фото нужно выбрать заново.
let skin = null;   // {blob, url}
function shrink(file){
  return new Promise((ok, fail) => {
    const img = new Image(), src = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1280 / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => b ? ok({blob:b, url:URL.createObjectURL(b)}) : fail(new Error("toBlob")), "image/jpeg", .87);
    };
    img.onerror = fail; img.src = src;
  });
}

// Боту картинку напрямую не передать (Telegram пропускает из приложения только 4 КБ текста),
// поэтому фото кладём на временный хостинг, а бот забирает его оттуда по ссылке.
const UPLOADERS = [
  async b => { const fd = new FormData(); fd.append("reqtype","fileupload"); fd.append("time","24h"); fd.append("fileToUpload", b, "skin.jpg");
    const r = await fetch("https://litterbox.catbox.moe/resources/internals/api.php", {method:"POST", body:fd});
    const u = (await r.text()).trim(); if (!r.ok || !/^https:\/\/litter\.catbox\.moe\//.test(u)) throw new Error(u.slice(0,80)); return u; },
  async b => { const fd = new FormData(); fd.append("file", b, "skin.jpg");
    const r = await fetch("https://tmpfiles.org/api/v1/upload", {method:"POST", body:fd});
    const j = await r.json(); if (j.status !== "success") throw new Error(j.message);
    return j.data.url.replace("tmpfiles.org/", "tmpfiles.org/dl/").replace("http://", "https://"); },
];
async function uploadSkin(){
  for (const up of UPLOADERS){
    try { return await Promise.race([up(skin.blob), new Promise((_,f)=>setTimeout(()=>f(new Error("timeout")), 25000))]); }
    catch(e){ console.warn("upload failed", e); }
  }
  return "";
}

const bytes = s => new TextEncoder().encode(s).length;
async function pack(obj){
  const plain = JSON.stringify(obj);
  if (bytes(plain) <= 4000 || !window.CompressionStream) return plain;
  const stream = new Blob([plain]).stream().pipeThrough(new CompressionStream("deflate-raw"));
  const buf = new Uint8Array(await new Response(stream).arrayBuffer());
  let bin = ""; buf.forEach(b => bin += String.fromCharCode(b));
  return JSON.stringify({z: btoa(bin)});
}

async function send(skinUrl){
  const data = await pack(payload(skinUrl));
  if (bytes(data) > 4096){
    $("#out").innerHTML = `<div class="msg bad">Анкета получилась слишком длинной для Telegram. Сократи немного «О себе» или «Мотивацию» и отправь снова.</div>`;
    nextBtn.disabled = false; nextBtn.textContent = "Отправить анкету";
    return;
  }
  const inTelegram = tg && tg.platform && tg.platform !== "unknown";
  if (inTelegram) {
    try { tg.sendData(data); try{ localStorage.removeItem(SAVE_KEY); }catch(e){} return; }
    catch(e) {
      $("#out").innerHTML = `<div class="msg bad">Не получилось отправить (${esc(e.message||e)}). Закрой приложение и открой его кнопкой <b>«🌸 Вступить в клан»</b> под полем ввода сообщения — твои ответы сохранятся.</div>`;
      nextBtn.disabled = false; nextBtn.textContent = "Отправить анкету";
      return;
    }
  }
  // открыто в обычном браузере — показываем, что ушло бы боту
  $("#out").innerHTML = `<div class="msg bad">Это не Telegram, поэтому показываю, что получит бот:</div><pre style="white-space:pre-wrap;font-size:12px">${esc(JSON.stringify(payload(skinUrl),null,1))}</pre>`;
  nextBtn.disabled = false; nextBtn.textContent = "Отправить анкету";
}

function renderDone(s){
  screen.innerHTML = header("Почти готово","последний шаг") + `<div class="card fade">
    <p>Правила прочитаны, анкета заполнена. Нажми «Отправить» — анкета вместе со скриншотом скина уйдёт администрации.</p>
    ${skin ? `<img src="${skin.url}" alt="" style="max-height:160px;border-radius:10px;box-shadow:var(--glow);display:block;margin:6px auto 10px">` : ""}
    <div id="out"></div></div>`;
  if (!skin){   // приложение перезапускали — фото не сохраняется, выбрать заново
    nextBtn.textContent = "Выбрать фото скина";
    nextBtn.onclick = () => go(pos-1);
    $("#out").innerHTML = `<div class="msg bad">Фото скина нужно выбрать заново — вернись на шаг назад.</div>`;
    return;
  }
  nextBtn.textContent = "Отправить анкету";
  nextBtn.onclick = async () => {
    nextBtn.disabled = true; nextBtn.textContent = "Загружаю скин…";
    const url = await uploadSkin();
    if (url) return await send(url);
    nextBtn.disabled = false; nextBtn.textContent = "Попробовать ещё раз";
    $("#out").innerHTML = `<div class="msg bad">Не получилось загрузить фото (бывает при плохом интернете или VPN). Попробуй ещё раз — или отправь анкету без фото, и бот попросит прислать скин в чат.</div>
      <button class="btn ghost" id="nophoto" style="width:100%">Отправить без фото</button>`;
    $("#nophoto").onclick = () => send("");
  };
}

// ---------- Анки ----------
const ankiEl = $("#anki"), aBubbleEl = $("#abubble");
let ankiTimer = null, aBubbleTimer = null;
let aTaps = [], hotUntil = 0, offUntil = 0;
function anki(mood, html, ms = 3200){
  if (Date.now() < offUntil) return;        // перезагружается — молчит
  ankiEl.classList.remove("a-ok","a-sad"); void ankiEl.offsetWidth;
  if (mood) ankiEl.classList.add("a-" + mood);
  clearTimeout(ankiTimer); ankiTimer = setTimeout(() => ankiEl.classList.remove("a-ok","a-sad"), mood === "sad" ? 3400 : 1400);
  if (html){ aBubbleEl.innerHTML = html; aBubbleEl.classList.add("on");
    clearTimeout(aBubbleTimer); aBubbleTimer = setTimeout(() => aBubbleEl.classList.remove("on"), ms); }
}
const ANKI_OK = ["Верно ✓", "Ответы приняты ✓", "Проверка пройдена ✓ Идём дальше.", "Всё правильно ✓"];
const ANKI_HINT = {
  read:   "Читай внимательно. «Дальше» откроется, когда долистаешь до конца.",
  quiz:   "Проверка по прочитанному. Ошибёшься — верну перечитать, без штрафа.",
  admins: "Это администрация. С любыми вопросами — к ним.",
  form:   "Заполняй подробно: под полями видно, сколько ещё символов нужно.",
  done:   "Проверь скин и отправляй. Я передам анкету администрации ✓",
};
const hinted = new Set();
function ankiHint(s){
  if (hinted.has(pos) || !ANKI_HINT[s.type]) return;
  hinted.add(pos); setTimeout(() => anki(null, ANKI_HINT[s.type], 4200), 500);
}
function aSay(html, ms){ aBubbleEl.innerHTML = html; aBubbleEl.classList.add("on");
  clearTimeout(aBubbleTimer); aBubbleTimer = setTimeout(() => aBubbleEl.classList.remove("on"), ms); }
function sparks(){
  const r = ankiEl.getBoundingClientRect();
  for (let i=0;i<6;i++){
    const h = document.createElement("div"); h.className = "spark"; h.textContent = "⚡";
    h.style.left = (r.left + r.width/2 - 6 + (Math.random()-.5)*36) + "px"; h.style.top = (r.top + 8 + Math.random()*20) + "px";
    h.style.setProperty("--dx", ((Math.random()-.5)*70).toFixed(0) + "px"); h.style.animationDelay = (i*.08) + "s";
    document.body.appendChild(h); setTimeout(() => h.remove(), 1300);
  }
}
// Тапы: один — подсказка; 4 за 3 секунды — перегрев; тапнули ещё — короткое замыкание и перезагрузка
ankiEl.onclick = () => {
  const now = Date.now();
  if (now < offUntil) return;
  aTaps = aTaps.filter(x => now - x < 3000); aTaps.push(now);
  if (now < hotUntil && aTaps.length >= 2){
    aTaps = []; hotUntil = 0; offUntil = now + 12000;
    clearTimeout(ankiTimer); ankiEl.classList.remove("a-ok","a-sad","a-hot"); ankiEl.classList.add("a-zap"); sparks();
    aSay("ZZZT… ⚡ К-критическая ош-ш-шибка… п-перезагрузка…", 2600);
    setTimeout(() => { ankiEl.classList.remove("a-zap"); ankiEl.classList.add("a-off"); }, 1600);
    setTimeout(() => { ankiEl.classList.remove("a-off"); offUntil = 0;
      anki("ok", "Система перезапущена ✓ Больше так не делай.", 3600); }, 12000);
    return;
  }
  if (aTaps.length >= 4){
    aTaps = []; hotUntil = now + 4000;
    clearTimeout(ankiTimer); ankiEl.classList.remove("a-ok","a-sad"); ankiEl.classList.add("a-hot");
    aSay("Ты сейчас разогреешь мои микросхемы и я заглючу, давай переставай 🔥", 3800);
    ankiTimer = setTimeout(() => ankiEl.classList.remove("a-hot"), 3000);
    return;
  }
  if (now < hotUntil) return;
  const s = pos >= 0 ? STEPS[pos] : null;
  anki("ok", s && ANKI_HINT[s.type] ? ANKI_HINT[s.type] : "Я Анки, андроид-регистратор клана 🌸 Нажимай «Начать».", 4200);
};

// ---------- Черрик: шкодник, выглядывает с краёв ----------
const catEl = $("#cat"), bubbleEl = $("#bubble");
const peekEl = document.createElement("div"); peekEl.className = "peek"; document.body.appendChild(peekEl); peekEl.appendChild(catEl);
catEl.querySelector("svg").setAttribute("viewBox", "6 2 50 38");     // только морда: тело и хвост за краем
let catTimer = null, bubbleTimer = null, peekTimer = null, peekSide = null;
function say(text, ms = 2600){
  if (typing()) return;            // пока печатают — Черрик выглядывает молча
  bubbleEl.textContent = text; bubbleEl.classList.add("on", "free");
  const r = peekEl.getBoundingClientRect(), W = innerWidth, H = innerHeight, bw = Math.min(210, W - 28);
  let x = r.left + r.width/2 - bw/2, y = r.bottom + 8;
  if (peekSide === "left")  { x = r.right + 8; y = r.top + r.height/2 - 18; }
  if (peekSide === "right") { x = r.left - bw - 8; y = r.top + r.height/2 - 18; }
  bubbleEl.style.left = Math.max(14, Math.min(W - bw - 14, x)) + "px";
  bubbleEl.style.top = Math.max(14, Math.min(H - 160, y)) + "px";
  clearTimeout(bubbleTimer); bubbleTimer = setTimeout(() => bubbleEl.classList.remove("on"), ms);
}
function hearts(){
  const r = peekEl.getBoundingClientRect();
  for (let i=0;i<4;i++){
    const h = document.createElement("div"); h.className = "heart"; h.textContent = "♥";
    h.style.left = (r.left + r.width/2 - 6 + (Math.random()-.5)*20) + "px"; h.style.top = (r.top + r.height/2) + "px";
    h.style.setProperty("--dx", ((Math.random()-.5)*50).toFixed(0) + "px"); h.style.animationDelay = (i*.12) + "s";
    document.body.appendChild(h); setTimeout(() => h.remove(), 1700);
  }
}
const HIDE = {top:"translateY(-110%) rotate(180deg)", left:"translateX(-120%) rotate(90deg)", right:"translateX(120%) rotate(-90deg)"};
const SHOW = {top:"translateY(2%) rotate(180deg)",  left:"translateX(-4%) rotate(90deg)",  right:"translateX(4%) rotate(-90deg)"};
function peek(ms = 4200, side){
  clearTimeout(peekTimer);
  peekSide = side || ["top","top","left","right"][Math.random()*4|0];
  peekEl.style.transition = "none"; peekEl.classList.remove("on");
  peekEl.style.top = peekEl.style.left = peekEl.style.right = "";
  if (peekSide === "top"){ peekEl.style.top = "0"; peekEl.style.left = (14 + Math.random()*(innerWidth - 90)) + "px"; }
  else { peekEl.style.top = (90 + Math.random()*(innerHeight*.45)) + "px"; peekEl.style[peekSide] = "-8px"; }
  peekEl.style.transform = HIDE[peekSide]; void peekEl.offsetWidth;
  peekEl.style.transition = ""; peekEl.style.transform = SHOW[peekSide]; peekEl.classList.add("on");
  peekTimer = setTimeout(hide, ms);
}
function hide(){ clearTimeout(peekTimer); if (peekSide) peekEl.style.transform = HIDE[peekSide]; peekEl.classList.remove("on"); bubbleEl.classList.remove("on"); }
function cat(mood, text){
  if (Date.now() < sulkUntil) return;   // обиженный — не выглядывает даже порадоваться
  peek(3600);
  catEl.classList.remove("happy","sad","annoyed"); void catEl.offsetWidth;
  if (mood) catEl.classList.add(mood);
  setTimeout(() => { if (mood === "happy") hearts(); if (text) say(text, 2600); }, 450);
  clearTimeout(catTimer); catTimer = setTimeout(() => catEl.classList.remove("happy","sad"), 1600);
}
const PRAISE = ["Мур, умница! 💗", "Я всё видел! ✨", "Мяу, так держать 🐾"];
const SNEAK = ["Псс… 👀", "Я не подглядываю 🙈", "Ку-ку! 🐾", "*шуршит*", "Мур? Ты всё ещё читаешь?", "Анки, не выдавай меня!", "Тут кто-то есть? 👀"];
// Тапы: первый — радуется и прячется; затискали (3+ тапа за 3 с) — мотает головой и ворчит;
// продолжили тапать — обижается, удирает и минуту не показывается
let taps = [], annoyedUntil = 0, sulkUntil = 0, leaving = false;
catEl.onclick = () => {
  const now = Date.now();
  if (now < sulkUntil) return;
  taps = taps.filter(x => now - x < 3000); taps.push(now);
  if (now < annoyedUntil && taps.length >= 2){
    taps = []; annoyedUntil = 0; sulkUntil = now + 60000; leaving = true;
    catEl.classList.remove("happy","annoyed"); catEl.classList.add("sulk");
    say("Всё, я обиделся 😤", 1800);
    clearTimeout(peekTimer); peekTimer = setTimeout(() => { hide(); catEl.classList.remove("sulk"); leaving = false; }, 1400);
    return;
  }
  if (taps.length >= 3){
    taps = []; annoyedUntil = now + 4000; leaving = true;
    catEl.classList.remove("happy"); void catEl.offsetWidth; catEl.classList.add("annoyed");
    document.querySelectorAll(".heart").forEach(h => h.remove());
    say("Эй, ты меня загладишь! Перестань 😾", 2600);
    clearTimeout(peekTimer); peekTimer = setTimeout(() => { catEl.classList.remove("annoyed"); hide(); leaving = false; }, 2600);
    return;
  }
  if (leaving) return;            // уже прячется — повторные тапы не перезапускают анимацию
  leaving = true;
  catEl.classList.remove("sad","annoyed"); catEl.classList.add("happy"); hearts();
  say(["Мяу! Нашёл меня 🙈", "Мур~ погладили 💗", "Ой, спалился! 🐾"][Math.random()*3|0], 1800);
  clearTimeout(peekTimer); peekTimer = setTimeout(() => { catEl.classList.remove("happy"); hide(); leaving = false; }, 1800);
};
// шкодит: выглядывает редко — раз в 45–90 секунд; после обиды минуту не появляется, потом мирится
let forgive = false;
(function prowl(){
  setTimeout(() => {
    const now = Date.now();
    if (now >= sulkUntil && !document.hidden && !peekEl.classList.contains("on") && !document.querySelector(".intro")){
      peek(3200 + Math.random()*2200);
      if (forgive){ forgive = false; setTimeout(() => say("Ладно, прощаю 🐾", 2200), 600); }
      else if (Math.random() < .45) setTimeout(() => say(SNEAK[Math.random()*SNEAK.length|0], 2200), 600);
      const IDLE = ["tilt", "twitch", "look"]; const a = IDLE[Math.random()*IDLE.length|0];
      setTimeout(() => { catEl.classList.add(a); setTimeout(() => catEl.classList.remove(a), 2000); }, 700);
    } else if (now < sulkUntil) forgive = true;
    prowl();
  }, 45000 + Math.random()*45000);
})();

// ---------- заставка ----------
function intro(back){
  const box = document.createElement("div"); box.className = "intro";
  const catSvg = catEl.querySelector("svg").outerHTML.replace(/viewBox="[^"]*"/, 'viewBox="0 0 60 70"');
  box.innerHTML = `<div class="duo">
      <div class="who" id="iA"><div class="fig">${ankiEl.innerHTML}</div><div class="name">Анки</div></div>
      <div class="who" id="iC"><div class="fig">${catSvg}</div><div class="name">Черрик</div></div></div>
    <div class="lines" id="iL"></div>
    <div class="load"><i id="iBar"></i></div><div class="skip">нажми, чтобы пропустить</div>`;
  document.body.appendChild(box);
  const lines = back
    ? [["a","С возвращением ✓ Восстанавливаю прогресс…"], ["c","Мяу! Я скучал 🐾"]]
    : [["a","Система запущена ✓ Привет! Я <b>Анки</b>, андроид-регистратор клана Cherry Blossoms 🌸"],
       ["c","А я Черрик! Мур~ Буду рядом… где-нибудь 👀"], ["a","Загружаю правила и анкету…"]];
  const T = []; const at = (ms, f) => T.push(setTimeout(f, ms));
  at(150, () => $("#iA").classList.add("in")); at(500, () => $("#iC").classList.add("in"));
  lines.forEach(([w, h], i) => at(700 + i*1250, () => {
    const d = document.createElement("div"); d.className = "ln " + w; d.innerHTML = h; $("#iL").appendChild(d);
    requestAnimationFrame(() => d.classList.add("in"));
  }));
  const end = 700 + lines.length*1250 + 900;
  at(end - 1700, () => $("#iBar").style.width = "100%");
  const close = () => { T.forEach(clearTimeout); box.classList.add("out"); setTimeout(() => box.remove(), 500);
    setTimeout(() => peek(3000, "top"), 2500); };
  at(end, close); box.onclick = close;
}

function go(i){ pos = i; render(); }
backBtn.onclick = () => { if (pos >= 0) go(pos-1); };

// фон: большие неоновые цветки сакуры + падающие лепестки
(function(){
  const bg = $("#bg");
  function petal(cx,cy,ang,r){
    const a = ang*Math.PI/180, P = (x,y)=>[cx+x*Math.cos(a)-y*Math.sin(a), cy+x*Math.sin(a)+y*Math.cos(a)].map(v=>v.toFixed(1)).join(",");
    return `M${P(0,0)} C${P(-.55*r,-.45*r)} ${P(-.6*r,-.95*r)} ${P(-.18*r,-r)} L${P(0,-.82*r)} L${P(.18*r,-r)} C${P(.6*r,-.95*r)} ${P(.55*r,-.45*r)} ${P(0,0)}Z`;
  }
  const flower = rot => `<svg viewBox="-50 -50 100 100">${[0,1,2,3,4].map(i=>`<path d="${petal(0,0,rot+i*72,44)}"/>`).join("")}<circle r="4"/></svg>`;
  [[-40,60,170,0],[78,8,120,20],[70,62,90,40],[-14,88,110,10],[40,30,60,50]].forEach(([x,y,size,rot],i)=>{
    const d = document.createElement("div"); d.className = "bloom";
    d.style.cssText = `left:${x}%;top:${y}%;width:${size}px;height:${size}px;animation-delay:${-i*2}s;opacity:${i>3?.2:.32}`;
    d.innerHTML = flower(rot); bg.appendChild(d);
  });
  for (let i=0;i<14;i++){
    const p = document.createElement("div"); p.className = "petal"+(i%4===0?" v":"");
    p.style.left = (Math.random()*115)+"%"; p.style.animationDuration = (10+Math.random()*10)+"s";
    p.style.animationDelay = (-Math.random()*20)+"s"; p.style.scale = (.6+Math.random()*.8).toFixed(2);
    bg.appendChild(p);
  }
})();

load(); render();
intro(reached >= 0);
</script>
